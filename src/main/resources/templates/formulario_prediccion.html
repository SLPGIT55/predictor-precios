<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Precios Sin IA</title>
</head>
<body>
<h1>Calculadora de Precios de Producto</h1>

<form th:action="@{/predecir}" th:object="${producto}" method="post">

  <label for="base">Precio Base Inicial:</label>
  <input type="number" id="base" th:field="*{precioBaseInicial}" step="0.01" required><br><br>

  <label for="calidad">Calidad del Material (1-10):</label>
  <input type="number" id="calidad" th:field="*{calidadMaterial}" min="1" max="10" step="0.1" required><br><br>

  <label for="antiguedad">Antigüedad (Años):</label>
  <input type="number" id="antiguedad" th:field="*{antiguedadAnios}" min="0" required><br><br>

  <button type="submit">Calcular Precio Predicho</button>
</form>

<hr>

<div th:if="${producto.precioPredicho > 0}">
  <h2>Resultado:</h2>
  <p>El precio predicho según la fórmula es de:</p>
  <p><strong><span th:text="${#numbers.formatDecimal(producto.precioPredicho, 0, 2)}"></span> €</strong></p>
  <p>Factores utilizados: Base [<span th:text="${producto.precioBaseInicial}"></span>], Calidad [<span th:text="${producto.calidadMaterial}"></span>], Antigüedad [<span th:text="${producto.antiguedadAnios}"></span>]</p>
</div>

</body>
</html>ml>
