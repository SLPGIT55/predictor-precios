<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Crear Nuevo Producto</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        form { width: 300px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<h1>Crear Nuevo Producto</h1>

<form th:action="@{/productos/guardar}" th:object="${producto}" method="post">

    <div>
        <label for="nombre">Nombre del Producto:</label>
        <input type="text" id="nombre" th:field="*{nombre}" required>
    </div>

    <div>
        <label for="precio">Precio:</label>
        <input type="number" id="precio" th:field="*{precio}" step="0.01" required>
    </div>

    <button type="submit">Guardar Producto</button>
</form>

<p><a href="/">Volver a la Lista</a></p>
</body>
</html>
